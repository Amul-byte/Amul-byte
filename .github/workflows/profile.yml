name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *" # run daily (UTC)
  workflow_dispatch: # allow manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Use your PAT secret name below
          GITHUB_TOKEN: ${{ secrets.PROFILE_SUMMARY_CARDS_TOKEN }}
        with:
          USERNAME: Amul-byte
          # Optional: uncomment to generate specific themes (comma-separated)
          # THEME: dracula,github_dark,tokyonight,default
